<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>טאלה — תפריט</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Calibri','Assistant',Arial,sans-serif;
    color:#000;background:#fff;
    direction:rtl;text-align:right;
    font-size:11pt;line-height:1.34;
  }
  .page{max-width:680px;margin:0 auto;padding:24px 30px 34px}

  .brand{text-align:center;margin-bottom:14px}
  .brand img{width:96px;height:auto;display:inline-block}

  .title{font-weight:700;font-size:13.5pt;margin:2px 0 2px}
  .subtitle{font-weight:700;font-size:12pt;margin:0 0 10px}
  .cat{font-weight:700;font-size:13pt;margin:18px 0 7px}

  .addon{font-weight:400;font-size:10.5pt;margin:0 0 8px}

  .dish{margin-bottom:10px}
  .dish .nm{font-weight:700}
  .dish .ing{font-weight:400}

  .dgrp{font-weight:700;margin:10px 0 3px}
  .drow{padding:.5px 0}
  .drow b{font-weight:700}

  @page{ size:A4; margin:18mm 20mm }
  @media print{ .dish,.dgrp,.cat{break-inside:avoid} }
</style>
</head>
<body>
<div class="page" id="page">…</div>
<script src="menu-data.js"></script>
<script>
function ing(desc){
  return String(desc).replace(/\s*\.\s*$/,'').replace(/\s*[.,]\s+/g,' | ').trim();
}
function dish(it){
  const extra=[];
  if(it.gluten_free_option) extra.push('ללא גלוטן');
  if(it.spicy) extra.push('חריף');
  const tail = extra.length ? ' | '+extra.join(' | ') : '';
  return `<div class="dish">
    <div class="nm">${it.name_he} - ${it.price}₪</div>
    <div class="ing">${ing(it.description_he)}${tail}</div>
  </div>`;
}
const M=window.MENU;
let h=`<div class="brand"><img src="images/tala-logo.png" alt="Tala"></div>`;
h+=`<div class="title">טאלה — מטבח תאילנדי כשר | Tala Thai Kitchen</div>`;
h+=`<div class="subtitle">תפריט הרצה</div>`;

for(const cat of M.categories){
  h+=`<div class="cat">${cat.name_he} | ${cat.name_en}</div>`;
  if(cat.protein_addon_he) h+=`<div class="addon">${cat.protein_addon_he}</div>`;
  h+= cat.items.map(dish).join('');
}

const D=M.drinks;
h+=`<div class="title" style="margin-top:20px">${D.name_he} | ${D.name_en}</div>`;
for(const sec of D.sections){
  h+=`<div class="cat">${sec.name_he} | ${sec.name_en}</div>`;
  if(sec.type==='chaser_serve') h+=`<div class="addon">צ׳ייסר / מנה</div>`;
  for(const g of sec.groups){
    if(g.label_he) h+=`<div class="dgrp">${g.label_he}</div>`;
    h+= g.items.map(it=>{
      if(sec.type==='chaser_serve'){
        const c=it.chaser!=null?it.chaser:'', s=it.serve!=null?it.serve:'';
        return `<div class="drow">${it.name} - <b>${c} / ${s}₪</b></div>`;
      }
      return `<div class="drow">${it.name} - <b>${it.price}₪</b></div>`;
    }).join('');
  }
}
document.getElementById('page').innerHTML=h;
</script>
</body>
</html>
