<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>טאלה — מטבח תאילנדי | Tala Thai Kitchen</title>
<meta name="description" content="התפריט של טאלה — מטבח תאילנדי כשר. ראשונות, עיקריות, קארי, פאד תאי ועוד.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Heebo:wght@300;400;500;700&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#16263f;
    --navy-soft:#1f3252;
    --gold:#c6a35c;
    --gold-soft:#d8bd86;
    --cream:#f7f3ea;
    --paper:#fffdf8;
    --ink:#24211c;
    --muted:#7c7468;
    --line:#e7ddc9;
    --shadow:0 18px 40px -22px rgba(22,38,63,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Heebo',sans-serif;
    color:var(--ink);
    background:var(--cream);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Frank Ruhl Libre',serif;font-weight:700;line-height:1.2}

  /* ---------- Hero ---------- */
  .hero{
    position:relative;
    background:#d7c3aa;
    color:var(--navy);
    text-align:center;
    padding:26px 20px 38px;
    overflow:hidden;
  }
  .hero::after{
    content:"";position:absolute;left:0;right:0;bottom:0;height:5px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
  }
  .logo{
    width:min(380px,76vw);height:auto;display:block;margin:0 auto;
  }
  .brand-he{
    font-family:'Frank Ruhl Libre',serif;
    font-size:clamp(17px,4.6vw,24px);
    color:var(--navy);
    margin-top:-6px;
    font-weight:500;
  }
  .tagline{color:#6b5d42;font-size:14px;margin-top:6px;font-weight:400;letter-spacing:.04em}

  /* ---------- Category nav ---------- */
  nav{
    position:sticky;top:0;z-index:20;
    background:rgba(247,243,234,.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .nav-inner{
    max-width:1080px;margin:0 auto;
    display:flex;gap:10px;justify-content:center;flex-wrap:wrap;
    padding:14px 16px;
  }
  nav a{
    text-decoration:none;color:var(--navy);
    font-weight:500;font-size:15px;
    padding:7px 18px;border-radius:999px;
    border:1px solid transparent;transition:.2s;
  }
  nav a:hover{background:#fff;border-color:var(--line)}

  /* ---------- Layout ---------- */
  main{max-width:1080px;margin:0 auto;padding:46px 18px 80px}
  .cat-head{text-align:center;margin:30px 0 8px}
  .cat-head h2{
    font-size:clamp(26px,6vw,36px);color:var(--navy);
    display:inline-block;position:relative;padding:0 10px;
  }
  .cat-head .en{
    display:block;font-family:'Cormorant Garamond',serif;
    letter-spacing:.3em;color:var(--gold);font-size:14px;
    font-weight:600;margin-top:4px;padding-inline-start:.3em;
  }
  .addon{
    text-align:center;color:var(--muted);font-size:14px;
    background:#fff;border:1px dashed var(--line);border-radius:12px;
    padding:10px 16px;max-width:640px;margin:16px auto 4px;
  }

  /* ---------- Grid + cards ---------- */
  .grid{
    display:grid;gap:22px;margin-top:26px;
    grid-template-columns:repeat(auto-fill,minmax(290px,1fr));
  }
  .card{
    background:var(--paper);border:1px solid var(--line);
    border-radius:18px;overflow:hidden;box-shadow:var(--shadow);
    display:flex;flex-direction:column;transition:.25s;
  }
  .card:hover{transform:translateY(-4px);box-shadow:0 26px 50px -24px rgba(22,38,63,.55)}
  .ph{position:relative;aspect-ratio:4/3;background:#ece4d3;overflow:hidden}
  .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .noimg{
    width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:6px;color:#a99e87;
    background:repeating-linear-gradient(45deg,#efe7d6,#efe7d6 12px,#ece3d0 12px,#ece3d0 24px);
  }
  .noimg span{font-size:34px}
  .noimg small{font-size:12px;letter-spacing:.05em}
  .badge{
    position:absolute;top:10px;inset-inline-start:10px;
    background:rgba(22,38,63,.86);color:#fff;font-size:12px;font-weight:500;
    padding:4px 11px;border-radius:999px;backdrop-filter:blur(4px);
  }
  .body{padding:16px 18px 18px;display:flex;flex-direction:column;flex:1}
  .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .name{font-family:'Frank Ruhl Libre',serif;font-size:20px;font-weight:700;color:var(--navy)}
  .name .en{display:block;font-family:'Cormorant Garamond',serif;font-size:14px;color:var(--gold);font-weight:600;letter-spacing:.02em}
  .price{
    font-family:'Frank Ruhl Libre',serif;font-weight:700;font-size:19px;
    color:var(--navy);white-space:nowrap;
  }
  .desc{color:var(--muted);font-size:14.5px;margin-top:10px;font-weight:300}
  .tags{margin-top:12px;display:flex;gap:7px;flex-wrap:wrap}
  .tag{font-size:12px;font-weight:500;padding:3px 10px;border-radius:999px}
  .tag.spicy{background:#fbe9e6;color:#c0392b}
  .tag.gf{background:#e9f3ea;color:#3a7d44}

  /* ---------- Footer ---------- */
  footer{
    background:var(--navy);color:#c8d0dd;text-align:center;
    padding:34px 20px;font-size:13.5px;font-weight:300;
  }
  footer .gold{color:var(--gold-soft);letter-spacing:.3em;font-family:'Cormorant Garamond',serif;font-size:18px}
  footer a{color:var(--gold-soft)}
</style>
</head>

function dishCard(item){
  const img = item.image
    ? `<img src="${item.image}" alt="${item.name_he}" loading="lazy">`
    : `<div class="noimg"><span>🍽️</span><small>אין תמונה</small></div>`;
  const badge = item.spicy ? `<div class="badge">🌶️ חריף</div>` : "";
  const tags = [];
  if(item.spicy) tags.push(`<span class="tag spicy">חריף</span>`);
  if(item.gluten_free_option) tags.push(`<span class="tag gf">אופציה ללא גלוטן</span>`);
  return `
  <article class="card">
    <div class="ph">${img}${badge}</div>
    <div class="body">
      <div class="row">
        <div class="name">${item.name_he}<span class="en">${item.name_en}</span></div>
        <div class="price">${item.price} ₪</div>
      </div>
      <p class="desc">${item.description_he}</p>
      ${tags.length ? `<div class="tags">${tags.join("")}</div>` : ""}
    </div>
  </article>`;
}

function render(){
  const app = document.getElementById("app");
  app.innerHTML = MENU.categories.map(cat => `
    <section id="${cat.id}">
      <div class="cat-head">
        <h2>${cat.name_he}<span class="en">${cat.name_en}</span></h2>
      </div>
      ${cat.protein_addon_he ? `<p class="addon">${cat.protein_addon_he}</p>` : ""}
      <div class="grid">${cat.items.map(dishCard).join("")}</div>
    </section>
  `).join("");
}
render();
</script>
